name: CLOBD Sequential Pixeldrain Upload Queue
run-name: "CLOBD Queue Job #${{ github.event.client_payload.job_id }} | ${{ github.event.client_payload.platform }}"

on:
  repository_dispatch:
    types: [mirror_gdrive_file]

# WordPress dispatches only one job at a time. This concurrency group is a
# second safety layer in case a duplicate dispatch is accidentally sent.
concurrency:
  group: clobd-pixeldrain-upload-queue
  cancel-in-progress: false

jobs:
  mirror_file:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Register the GitHub run ID before checkout/dependency installation.
      # This lets WordPress detect failures that happen before the uploader runs.
      - name: Register GitHub Run with WordPress
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = os.environ.get("PROGRESS_URL", "").strip()
          payload = {
              "webhook_secret": os.environ.get("WEBHOOK_SECRET", ""),
              "job_id": os.environ.get("JOB_ID", ""),
              "stage": "starting",
              "message": "GitHub Actions runner registered. Preparing the upload job.",
              "github_run_id": os.environ.get("GH_RUN_ID", ""),
          }
          if not url:
              print("::warning::WordPress progress URL is missing; WordPress will locate this run through the GitHub API.")
          else:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"WordPress run registration: HTTP {response.status}")
              except Exception as error:
                  print(f"::warning::Could not register GitHub run with WordPress: {error}")
          PY

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip gdown requests

      - name: Download, Check Exact Filename, and Upload to Pixeldrain
        shell: python
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          PLATFORM: ${{ github.event.client_payload.platform }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          GDRIVE_ID: ${{ github.event.client_payload.gdrive_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
          DUPLICATE_CHECK_URL: ${{ github.event.client_payload.duplicate_check_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          PIXELDRAIN_API: ${{ github.event.client_payload.pixeldrain_api }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          import os
          import sys
          import traceback
          import requests
          import gdown
          from urllib.parse import quote

          JOB_ID = os.environ.get("JOB_ID", "").strip()
          PLATFORM = os.environ.get("PLATFORM", "pixeldrain").strip().lower()
          POST_ID = os.environ.get("POST_ID", "").strip()
          GDRIVE_ID = os.environ.get("GDRIVE_ID", "").strip()
          CALLBACK_URL = os.environ.get("CALLBACK_URL", "").strip()
          PROGRESS_URL = os.environ.get("PROGRESS_URL", "").strip()
          DUPLICATE_CHECK_URL = os.environ.get("DUPLICATE_CHECK_URL", "").strip()
          WEBHOOK_SECRET = os.environ.get("WEBHOOK_SECRET", "").strip()
          PIXELDRAIN_API = os.environ.get("PIXELDRAIN_API", "").strip()
          RUN_ID = os.environ.get("GH_RUN_ID", "").strip()

          HEADERS = {
              "User-Agent": "CLOBD-GitHub-Actions-Upload-Queue/1.0",
              "Accept": "application/json",
          }

          def update_progress(stage, message, file_name=""):
              if not PROGRESS_URL or not WEBHOOK_SECRET or not JOB_ID:
                  return
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "job_id": JOB_ID,
                  "stage": stage,
                  "message": message,
                  "file_name": file_name,
                  "github_run_id": RUN_ID,
              }
              try:
                  response = requests.post(
                      PROGRESS_URL,
                      json=payload,
                      headers=HEADERS,
                      timeout=20,
                  )
                  response.raise_for_status()
              except Exception as error:
                  # Progress reporting is helpful, but a temporary dashboard
                  # connection issue should not interrupt a valid file upload.
                  print(f"::warning title=Queue Progress Update::{error}")

          def send_final_result(result_status, file_name="", pixeldrain_url="", message=""):
              if not CALLBACK_URL or not WEBHOOK_SECRET:
                  raise RuntimeError("WordPress callback URL or webhook secret is missing.")

              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "job_id": JOB_ID,
                  "post_id": POST_ID,
                  "file_name": file_name,
                  "pixeldrain_url": pixeldrain_url,
                  "result_status": result_status,
                  "message": message,
              }
              response = requests.post(
                  CALLBACK_URL,
                  json=payload,
                  headers=HEADERS,
                  timeout=45,
              )
              response.raise_for_status()
              print(f"::notice title=WordPress Queue Updated::HTTP {response.status_code} - {response.text[:500]}")

          def find_wordpress_duplicate(file_name):
              """Search historical WordPress upload records using an exact filename."""
              if not DUPLICATE_CHECK_URL:
                  raise RuntimeError("WordPress duplicate-check endpoint is missing. Upload stopped to avoid duplicate files.")

              response = requests.post(
                  DUPLICATE_CHECK_URL,
                  json={
                      "webhook_secret": WEBHOOK_SECRET,
                      "file_name": file_name,
                  },
                  headers=HEADERS,
                  timeout=(20, 120),
              )
              response.raise_for_status()
              data = response.json()
              if not isinstance(data, dict) or data.get("success") is not True:
                  raise RuntimeError("WordPress duplicate-check endpoint did not return a valid result.")

              if data.get("duplicate") and data.get("pixeldrain_url"):
                  return str(data.get("pixeldrain_url"))
              return ""

          def find_exact_duplicate(file_name):
              """Return (file_id, url) for an exact-name match in this API account."""
              response = requests.get(
                  "https://pixeldrain.com/api/user/files",
                  auth=("", PIXELDRAIN_API),
                  headers=HEADERS,
                  timeout=(20, 90),
              )
              response.raise_for_status()

              try:
                  data = response.json()
              except ValueError as error:
                  raise RuntimeError("Pixeldrain account file-list API returned invalid JSON.") from error

              files = data.get("files") if isinstance(data, dict) else None
              if not isinstance(files, list):
                  raise RuntimeError("Pixeldrain account file-list API did not return a valid files array. Upload stopped to prevent a duplicate.")

              # Exact, case-sensitive comparison. Similar titles are not duplicates.
              for item in files:
                  if not isinstance(item, dict):
                      continue
                  if item.get("name") == file_name and item.get("id"):
                      file_id = str(item["id"]).strip()
                      return file_id, f"https://pixeldrain.com/u/{quote(file_id, safe='')}"

              return "", ""

          file_name = ""
          pixeldrain_url = ""
          final_sent = False

          try:
              if not JOB_ID or not POST_ID or not GDRIVE_ID:
                  raise RuntimeError("Queue job ID, WordPress post ID, or Google Drive file ID is missing.")
              if PLATFORM != "pixeldrain":
                  raise RuntimeError(f"Unsupported upload platform: {PLATFORM}")
              if not PIXELDRAIN_API:
                  raise RuntimeError("Pixeldrain API key is missing. Configure it in WordPress > Files > Settings.")

              download_dir = os.path.abspath("downloads")
              os.makedirs(download_dir, exist_ok=True)
              os.chdir(download_dir)

              update_progress("downloading", "Downloading the source file from Google Drive.")
              print(f"::notice title=Queue Job::Job #{JOB_ID} | Post #{POST_ID} | Platform: {PLATFORM}")

              drive_url = f"https://drive.google.com/uc?id={GDRIVE_ID}"
              downloaded_path = gdown.download(drive_url, quiet=False)
              if not downloaded_path or not os.path.isfile(downloaded_path):
                  raise RuntimeError("Google Drive file could not be downloaded. Check access permissions and the source link.")

              file_path = os.path.abspath(downloaded_path)
              file_name = os.path.basename(file_path)
              if not file_name:
                  raise RuntimeError("Google Drive returned an empty filename.")

              file_size = os.path.getsize(file_path)
              if file_size <= 0:
                  raise RuntimeError("Downloaded file is empty. Upload cancelled.")

              file_size_gb = round(file_size / (1024 ** 3), 3)
              print(f"::notice title=Downloaded::{file_name} | {file_size_gb} GB")
              update_progress("checking_duplicate", "Checking Pixeldrain for an exact filename match.", file_name)

              wordpress_duplicate_url = find_wordpress_duplicate(file_name)
              if wordpress_duplicate_url:
                  pixeldrain_url = wordpress_duplicate_url
                  message = "Skipped upload: WordPress found a live Pixeldrain file with this exact filename in its historical upload index. Reusing its existing link."
                  print(f"::notice title=Duplicate Skipped::{file_name} already exists in the WordPress Pixeldrain index")
                  update_progress("finishing", message, file_name)
                  send_final_result("skipped_duplicate", file_name, pixeldrain_url, message)
                  final_sent = True
                  sys.exit(0)

              existing_id, existing_url = find_exact_duplicate(file_name)
              if existing_id:
                  pixeldrain_url = existing_url
                  message = "Skipped upload: a file with this exact filename already exists in the Pixeldrain account. Reusing its existing link."
                  print(f"::notice title=Duplicate Skipped::{file_name} already exists as {existing_id}")
                  update_progress("finishing", message, file_name)
                  send_final_result("skipped_duplicate", file_name, pixeldrain_url, message)
                  final_sent = True
                  sys.exit(0)

              update_progress("uploading", f"Uploading {file_name} ({file_size_gb} GB) to Pixeldrain.", file_name)
              encoded_name = quote(file_name, safe="")
              upload_url = f"https://pixeldrain.com/api/file/{encoded_name}"

              with open(file_path, "rb") as file_handle:
                  upload_response = requests.put(
                      upload_url,
                      auth=("", PIXELDRAIN_API),
                      data=file_handle,
                      headers=HEADERS,
                      timeout=(30, 7200),
                  )

              try:
                  upload_data = upload_response.json()
              except ValueError:
                  upload_data = {}

              if upload_response.status_code not in (200, 201) or not upload_data.get("id"):
                  details = upload_response.text[:1000] if upload_response.text else "No response body"
                  raise RuntimeError(f"Pixeldrain upload failed (HTTP {upload_response.status_code}): {details}")

              file_id = str(upload_data["id"]).strip()
              pixeldrain_url = f"https://pixeldrain.com/u/{quote(file_id, safe='')}"
              message = f"Upload completed successfully. File size: {file_size_gb} GB."
              print(f"::notice title=Pixeldrain Upload Complete::{pixeldrain_url}")
              update_progress("finishing", "Upload completed; saving the Pixeldrain URL to WordPress.", file_name)
              send_final_result("completed", file_name, pixeldrain_url, message)
              final_sent = True

          except SystemExit:
              raise
          except Exception as error:
              error_message = str(error) or error.__class__.__name__
              print(f"::error title=Upload Job Failed::{error_message}")
              traceback.print_exc()

              if not final_sent:
                  try:
                      update_progress("finishing", "Job failed; reporting the error to WordPress.", file_name)
                      send_final_result("failed", file_name, "", error_message[:1500])
                      final_sent = True
                  except Exception as callback_error:
                      print(f"::error title=WordPress Failure Callback::{callback_error}")

              sys.exit(1)

      # Covers failures before the upload script starts (checkout, pip install,
      # runner cancellation, timeout, etc.). Duplicate callbacks are harmless:
      # WordPress ignores jobs that are already in a terminal state.
      - name: Report workflow failure or cancellation to WordPress
        if: ${{ always() && job.status != 'success' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          JOB_STATUS: ${{ job.status }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ.get("CALLBACK_URL", "").strip()
          status = os.environ.get("JOB_STATUS", "failure").strip().lower()
          result_status = "cancelled" if status == "cancelled" else "failed"
          payload = {
              "webhook_secret": os.environ.get("WEBHOOK_SECRET", ""),
              "job_id": os.environ.get("JOB_ID", ""),
              "post_id": os.environ.get("POST_ID", ""),
              "result_status": result_status,
              "message": f"GitHub Actions ended with job status: {status}. This fallback callback was sent so the queue can continue.",
          }
          if not url:
              print("::warning::WordPress callback URL is missing; the queue watchdog will reconcile this run through GitHub.")
          else:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"WordPress fallback callback: HTTP {response.status}")
              except Exception as error:
                  print(f"::error::Could not send fallback callback to WordPress: {error}")
          PY

