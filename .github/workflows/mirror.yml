                          "FUCKINGFAST created the upload directory but did not return its directory ID. "
                          "Upload stopped safely; no alternate filename was generated. Response: "
                          + json.dumps(folder_create_payload, ensure_ascii=False)[:900]
                      )

                  print(
                      f"::notice title=FUCKINGFAST Isolated Directory::Created {folder_name}; "
                      "no account-wide filename duplicate scan was performed."
                  )

                  def _walk_named_items(value, depth=0):
                      if depth > 10:
                          return
                      if isinstance(value, dict):
                          name = value.get("name") or value.get("filename")
                          item_id = value.get("id") or value.get("fileId") or value.get("file_id")
                          item_type = str(value.get("type") or value.get("kind") or "").strip().casefold()
                          is_directory = (value.get("isDirectory") is True) or (value.get("is_dir") is True) or item_type in ("directory", "folder", "dir")
                          if isinstance(name, str) and _scalar_id(item_id) and not is_directory:
                              yield name, str(item_id).strip(), value
                          for key in ("data", "files", "folders", "directories", "items", "children", "contents", "result"):
                              if key in value:
                                  yield from _walk_named_items(value[key], depth + 1)
                      elif isinstance(value, list):
                          for item in value:
                              yield from _walk_named_items(item, depth + 1)

                  # Resolve the selected storage location. The upload goes directly
                  # into the unique directory created for this queue run; no move or
                  # account-wide filename scan is needed.
                  update_progress("uploading", f"Resolving FUCKINGFAST {FUCKINGFAST_REGION} storage location.", file_name)
                  locations_response = requests.get(
                      "https://fuckingfast.net/api/locations",
                      headers=HEADERS,
                      timeout=(20, 60),
                  )
                  locations_response.raise_for_status()
                  try:
                      locations_data = locations_response.json()
                  except ValueError as error:
                      raise RuntimeError("FUCKINGFAST locations API returned invalid JSON.") from error
                  location_rows = locations_data.get("data") if isinstance(locations_data, dict) else None
                  if not isinstance(location_rows, list):
                      raise RuntimeError("FUCKINGFAST locations API did not return a valid data array.")
                  location_id = ""
                  for location in location_rows:
                      if isinstance(location, dict) and str(location.get("name", "")).strip().casefold() == FUCKINGFAST_REGION.casefold():
                          location_id = str(location.get("id", "")).strip()
                          break
                  if not location_id:
                      available = ", ".join(str(x.get("name", "")) for x in location_rows if isinstance(x, dict))
                      raise RuntimeError(f"FUCKINGFAST region '{FUCKINGFAST_REGION}' was not returned by the locations API. Available: {available or 'none'}")

                  from urllib.parse import urlencode
                  encoded_name = quote(fuckingfast_upload_name, safe="")
                  encoded_upload_directory_id = quote(upload_directory_id, safe="")
                  query = urlencode({"locationId": location_id})
                  # Upload directly into the authenticated account root. The
                  # documented /{parentId}/{name} route avoids a second File
                  # Manager move request, which currently returns HTTP 405.
                  # Keep the selected storage location in the query string.
                  upload_url = f"https://w.fuckingfast.net/{encoded_upload_directory_id}/{encoded_name}?{query}"
                  upload_label = fuckingfast_upload_name if fuckingfast_upload_name != file_name else file_name
                  update_progress("uploading", f"Uploading {upload_label} ({file_size_gb} GiB) into your FUCKINGFAST account · {FUCKINGFAST_REGION}.", file_name)

                  # Use FUCKINGFAST's documented cURL -T upload method rather
                  # than requests.put() with a custom streaming iterator. This
                  # avoids the requests/urllib3 TLS EOF failure seen on large
                  # uploads and lets curl retry a dropped upload connection.
                  update_progress("uploading", f"Uploading {file_name} ({file_size_gb} GiB) into your FUCKINGFAST account · {FUCKINGFAST_REGION}.", file_name)

                  curl_config_path = ""
                  curl_response_path = ""
                  try:
                      # Keep the Account ID out of the curl process arguments.
                      config_fd, curl_config_path = tempfile.mkstemp(prefix="clobd-fuckingfast-", suffix=".curl")
                      os.chmod(curl_config_path, 0o600)
                      safe_account_id = FUCKINGFAST_ACCOUNT_ID.replace("\\", "\\\\").replace('"', '\\"').replace("\r", "").replace("\n", "")
                      with os.fdopen(config_fd, "w", encoding="utf-8") as config_file:
                          config_file.write(f'header = "Authorization: Bearer {safe_account_id}"\n')
                          config_file.write('header = "Content-Type: application/octet-stream"\n')

                      response_fd, curl_response_path = tempfile.mkstemp(prefix="clobd-fuckingfast-response-", suffix=".json")
                      os.close(response_fd)

                      curl_command = [
                          "curl",
                          "--http1.1",
                          "--show-error",
                          "--progress-bar",
                          "--connect-timeout", "60",
                          "--max-time", "0",
                          "--keepalive-time", "30",
                          "--retry", "4",
                          "--retry-connrefused",
                          "--retry-delay", "15",
                          "--retry-max-time", "14400",
                          "--upload-file", file_path,
                          "--config", curl_config_path,
                          "--output", curl_response_path,
                          "--write-out", "\n%{http_code}",
                          upload_url,
                      ]

                      print("::notice title=FUCKINGFAST Transport::Uploading the original filename into this job’s isolated authenticated directory. cURL retries transient connection/server errors, not permanent HTTP 400 filename conflicts.")
                      curl_process = subprocess.Popen(
                          curl_command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          encoding="utf-8",
                          errors="replace",
                          bufsize=1,
                      )

                      curl_stderr_lines = []
                      curl_line_buffer = ""
                      last_curl_percent = [-5]

                      def _handle_curl_progress_line(line):
                          line = line.strip()
                          if not line:
                              return
                          curl_stderr_lines.append(line)
                          lowered = line.casefold()
                          if "will retry" in lowered or "retrying" in lowered:
                              update_progress(
                                  "uploading",
                                  f"FUCKINGFAST connection was interrupted. cURL is retrying the upload from the beginning of the file ({FUCKINGFAST_REGION}).",
                                  file_name,
                              )
                          match = re.search(r"(?<!\d)(\d{1,3}(?:\.\d+)?)%", line)
                          if match:
                              percent = max(0, min(100, int(float(match.group(1)))))
                              if percent >= last_curl_percent[0] + 5 or percent == 100:
                                  last_curl_percent[0] = percent
                                  update_progress(
                                      "uploading",
                                      f"Uploading {file_name} into FUCKINGFAST account ({percent}% sent · {FUCKINGFAST_REGION}).",
                                      file_name,
                                  )

                      # Read cURL's carriage-return progress meter live so the
                      # WordPress Cloud Monitor continues receiving progress.
                      while True:
                          character = curl_process.stderr.read(1)
                          if character == "":
                              break
                          if character in ("\r", "\n"):
                              _handle_curl_progress_line(curl_line_buffer)
                              curl_line_buffer = ""
                          else:
                              curl_line_buffer += character
                      if curl_line_buffer:
                          _handle_curl_progress_line(curl_line_buffer)

                      curl_stdout = curl_process.stdout.read() if curl_process.stdout else ""
                      curl_return_code = curl_process.wait()
                      curl_http_text = (curl_stdout or "").strip().splitlines()
                      try:
                          curl_http_status = int(curl_http_text[-1]) if curl_http_text else 0
                      except (TypeError, ValueError):
                          curl_http_status = 0

                      try:
                          with open(curl_response_path, "r", encoding="utf-8", errors="replace") as response_file:
                              curl_response_text = response_file.read()
                      except OSError:
                          curl_response_text = ""

                      if curl_return_code != 0:
                          useful_curl_errors = [
                              line for line in curl_stderr_lines
                              if any(token in line.casefold() for token in ("curl:", "error", "retry", "failed", "ssl", "timed out"))
                          ]
                          curl_error_detail = "\n".join(useful_curl_errors[-12:])[-1600:]
                          if not curl_error_detail:
                              curl_error_detail = f"cURL exited with code {curl_return_code} without additional diagnostics."
                          raise RuntimeError(
                              "FUCKINGFAST upload transport failed after automatic retries "
                              f"(cURL exit {curl_return_code}). {curl_error_detail}"
                          )

                      if curl_http_status not in (200, 201):
                          raise RuntimeError(
                              f"Authenticated FUCKINGFAST account upload failed (HTTP {curl_http_status}): "
                              f"{curl_response_text[:1200] or 'No response body'}"
                          )

                      try:
                          upload_data = json.loads(curl_response_text)
                      except ValueError:
                          # The API documentation does not specify a response schema.
                          # Accept JSON objects as well as a plain ID / HTTPS URL response.
                          upload_data = {"raw": curl_response_text.strip()}

                      response_code = upload_data.get("code") if isinstance(upload_data, dict) else None
                      response_data = upload_data.get("data") if isinstance(upload_data, dict) and isinstance(upload_data.get("data"), dict) else upload_data
                      fuckingfast_file_id = ""
                      if isinstance(response_data, dict):
                          for id_key in ("id", "fileId", "file_id", "hash"):
                              candidate_id = response_data.get(id_key)
                              if isinstance(candidate_id, (str, int)) and str(candidate_id).strip():
                                  fuckingfast_file_id = str(candidate_id).strip()
                                  break
                      fuckingfast_returned_url = ""
                      if isinstance(response_data, dict):
                          for url_key in ("url", "downloadUrl", "download_url", "downloadPage", "downloadPageUrl", "shareUrl", "share_url", "link"):
                              candidate_url = response_data.get(url_key)
                              if isinstance(candidate_url, str) and candidate_url.strip().startswith("https://"):
                                  fuckingfast_returned_url = candidate_url.strip()
                                  break
                      if isinstance(upload_data, str):
                          raw_value = upload_data.strip()
                      elif isinstance(upload_data, dict):
                          raw_value = str(upload_data.get("raw", "")).strip()
                      else:
                          raw_value = ""
                      if not fuckingfast_returned_url and raw_value:
                          if raw_value.startswith("https://"):
                              fuckingfast_returned_url = raw_value
                          elif len(raw_value) <= 500 and " " not in raw_value:
                              fuckingfast_file_id = raw_value

                      # The developer page documents HTTP upload routes but not
                      # their JSON response schema. Trust HTTP 200/201 above,
                      # while still rejecting an explicit API-level failure.
                      if isinstance(upload_data, dict):
                          api_status = str(upload_data.get("status", "")).strip().casefold()
                          if upload_data.get("success") is False or api_status in ("error", "failed", "failure"):
                              raise RuntimeError(
                                  "FUCKINGFAST API reported an unsuccessful upload: "
                                  f"{curl_response_text[:1200]}"
                              )
                      # The API response schema is not documented. The authenticated
                      # File Manager lookup below is the final source of truth for the ID.

                      # Verify only the directory created for this queue run.
                      # This is post-upload verification, not a duplicate scan:
                      # the folder was empty when created and isolated to this job.
                      account_file_id = ""
                      account_file_item = None
                      expected_file_size = int(os.path.getsize(file_path))
                      verify_directory_url = f"https://fuckingfast.net/api/fs/{quote(upload_directory_id, safe='')}"
                      for verify_attempt in range(1, 5):
                          verify_directory_response = requests.get(
                              verify_directory_url,
                              headers=fuckingfast_auth_headers,
                              timeout=(20, 90),
                          )
                          if verify_directory_response.status_code != 200:
                              raise RuntimeError(
                                  "FUCKINGFAST post-upload directory verification failed "
                                  f"(HTTP {verify_directory_response.status_code}): {verify_directory_response.text[:700]}"
                              )
                          try:
                              verify_directory_payload = verify_directory_response.json()
                          except ValueError as error:
                              raise RuntimeError("FUCKINGFAST returned invalid JSON while verifying the isolated upload directory.") from error

                          for found_name, found_id, found_item in _walk_named_items(verify_directory_payload):
                              if found_name != fuckingfast_upload_name:
                                  continue
                              candidate_size = None
                              if isinstance(found_item, dict):
                                  for size_key in ("size", "fileSize", "file_size", "bytes"):
                                      value = found_item.get(size_key)
                                      if isinstance(value, (int, float)):
                                          candidate_size = int(value)
                                          break
                                      if isinstance(value, str) and value.strip().isdigit():
                                          candidate_size = int(value.strip())
                                          break
                              if candidate_size is not None and candidate_size != expected_file_size:
                                  raise RuntimeError(
                                      "FUCKINGFAST listed the uploaded filename but its stored size does not match "
                                      f"the source file: expected {expected_file_size} bytes, received {candidate_size} bytes."
                                  )
                              account_file_id = found_id
                              account_file_item = found_item
                              break

                          if account_file_id:
                              break
                          if verify_attempt < 4:
                              update_progress(
                                  "checking_account",
                                  f"Upload accepted; waiting for FUCKINGFAST to expose the file in its isolated directory (verification {verify_attempt}/4).",
                                  file_name,
                              )
                              time.sleep(3)

                      if not account_file_id:
                          detail_id = f" Upload response file ID: {fuckingfast_file_id}." if fuckingfast_file_id else " The upload response did not include a usable file ID."
                          raise RuntimeError(
                              "FUCKINGFAST accepted the upload request, but the exact original filename could not be "
                              "verified in this job's isolated directory after 4 checks. The link was not saved and "
                              "no alternate remote filename was generated."
                              + detail_id
                          )

                      if fuckingfast_file_id and account_file_id != fuckingfast_file_id:
                          print("::warning title=FUCKINGFAST File ID::The directory listing ID differs from the upload response; using the ID verified inside this job's isolated directory.")
                      fuckingfast_file_id = account_file_id
                      if isinstance(account_file_item, dict) and not fuckingfast_returned_url:
                          for item_url_key in ("url", "downloadUrl", "download_url", "downloadPage", "downloadPageUrl", "shareUrl", "share_url", "link"):
                              candidate_item_url = account_file_item.get(item_url_key)
                              if isinstance(candidate_item_url, str) and candidate_item_url.strip().startswith("https://"):
                                  fuckingfast_returned_url = candidate_item_url.strip()
                                  break

                      if fuckingfast_returned_url:
                          from urllib.parse import urlparse
                          parsed_fuckingfast_url = urlparse(fuckingfast_returned_url)
                          if parsed_fuckingfast_url.scheme != "https" or not parsed_fuckingfast_url.hostname or not (parsed_fuckingfast_url.hostname == "fuckingfast.net" or parsed_fuckingfast_url.hostname.endswith(".fuckingfast.net")):
                              raise RuntimeError("FUCKINGFAST returned a URL outside the official HTTPS domain. Upload result was not saved.")

                      returned_name = str(response_data.get("name", "")).strip() if isinstance(response_data, dict) else ""
                      if returned_name and returned_name != fuckingfast_upload_name:
                          raise RuntimeError(
                              "FUCKINGFAST accepted the upload but returned an unexpected filename. "
                              f"Expected '{fuckingfast_upload_name}', received '{returned_name}'."
                          )
                      returned_size = response_data.get("size") if isinstance(response_data, dict) else None
                      if returned_size is not None:
                          try:
                              if int(returned_size) != int(os.path.getsize(file_path)):
                                  raise RuntimeError(
                                      "FUCKINGFAST returned a file size that does not match the uploaded source: "
                                      f"expected {os.path.getsize(file_path)} bytes, received {returned_size} bytes."
                                  )
                          except (TypeError, ValueError):
                              print("::warning title=FUCKINGFAST Response::Could not parse returned file size; file ID was present and API success code was accepted.")
                      returned_location_id = str(response_data.get("locationId", "")).strip() if isinstance(response_data, dict) else ""
                      if returned_location_id and returned_location_id != location_id:
                          print(
                              f"::warning title=FUCKINGFAST Region::Requested location {location_id}, "
                              f"but API response reports {returned_location_id}. Check the file in FUCKINGFAST File Manager."
                          )
                      print(
                          f"::notice title=FUCKINGFAST Upload Accepted::API code {response_code or curl_http_status}; "
                          f"file ID {fuckingfast_file_id}; remote name {returned_name or fuckingfast_upload_name}."
                      )
                  finally:
                      for temporary_path in (curl_config_path, curl_response_path):
                          if temporary_path:
                              try:
                                  os.remove(temporary_path)
                              except OSError:
                                  pass

                  result_url = fuckingfast_returned_url or f"https://fuckingfast.net/{quote(fuckingfast_file_id, safe='')}"
                  from urllib.parse import urlparse
                  parsed_public_url = urlparse(result_url)
                  if parsed_public_url.scheme != "https" or not parsed_public_url.hostname or not (
                      parsed_public_url.hostname == "fuckingfast.net" or parsed_public_url.hostname.endswith(".fuckingfast.net")
                  ):
                      raise RuntimeError("FUCKINGFAST did not produce an HTTPS public page URL on its official domain. No link was saved.")

                  # Probe the page/byte-range endpoint before calling WordPress.
                  # A 404/410 or an explicit unavailable-page body is never saved.
                  with requests.get(
                      result_url,
                      headers={
                          "User-Agent": HEADERS["User-Agent"],
                          "Accept": "text/html,application/octet-stream;q=0.9,*/*;q=0.8",
                          "Range": "bytes=0-4095",
                      },
                      stream=True,
                      allow_redirects=True,
                      timeout=(20, 60),
                  ) as link_check_response:
                      if link_check_response.status_code < 200 or link_check_response.status_code >= 400:
                          raise RuntimeError(
                              f"FUCKINGFAST public-link verification failed (HTTP {link_check_response.status_code}). "
                              "The new URL was not saved to WordPress."
                          )
                      final_public_url = urlparse(link_check_response.url)
                      if final_public_url.scheme != "https" or not final_public_url.hostname or not (
                          final_public_url.hostname == "fuckingfast.net" or final_public_url.hostname.endswith(".fuckingfast.net")
                      ):
                          raise RuntimeError("FUCKINGFAST public link redirected outside its official HTTPS domain. The link was not saved.")
                      link_preview = bytearray()
                      for preview_chunk in link_check_response.iter_content(chunk_size=4096):
                          if preview_chunk:
                              link_preview.extend(preview_chunk[:4096])
                          if len(link_preview) >= 16384:
                              break
                      preview_text = bytes(link_preview).decode("utf-8", errors="ignore").casefold()
                      unavailable_markers = (
                          "file not found",
                          "this file was deleted",
                          "file has been deleted",
                          "file does not exist",
                          "file is unavailable",
                          "this file is no longer available",
                          "file has expired",
                          "download not found",
                          "404 not found",
                      )
                      if any(marker in preview_text for marker in unavailable_markers):
                          raise RuntimeError("FUCKINGFAST returned an unavailable/deleted-file page for the new upload. The link was not saved.")

                  message = (
                      f"FUCKINGFAST authenticated upload completed and verified in {FUCKINGFAST_REGION}. "
                      f"Remote filename (no generated suffix): {fuckingfast_upload_name}. File size: {file_size_gb} GiB."
                  )

              print(f"::notice title={PLATFORM.title()} Upload Complete::{result_url}")
              update_progress("finishing", f"Upload completed; saving the {PLATFORM} URL to WordPress.", file_name)
              send_final_result("completed", file_name, result_url, message)
              final_sent = True

          except SystemExit:
              raise
          except Exception as error:
              error_message = str(error) or error.__class__.__name__
              print(f"::error title=Upload Job Failed::{error_message}")
              traceback.print_exc()
              if not final_sent:
                  try:
                      update_progress("finishing", "Job failed; reporting the error to WordPress.", file_name)
                      send_final_result("failed", file_name, "", error_message[:1500])
                      final_sent = True
                  except Exception as callback_error:
                      print(f"::error title=WordPress Failure Callback::{callback_error}")
              sys.exit(1)

      # Covers failures before the upload script starts (checkout, pip install,
      # runner cancellation, timeout, etc.). Duplicate callbacks are harmless:
      # WordPress ignores jobs that are already in a terminal state.
      - name: Report workflow failure or cancellation to WordPress
        if: ${{ always() && job.status != 'success' }}
        shell: bash
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          PLATFORM: ${{ github.event.client_payload.platform }}
          JOB_STATUS: ${{ job.status }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ.get("CALLBACK_URL", "").strip()
          status = os.environ.get("JOB_STATUS", "failure").strip().lower()
          result_status = "cancelled" if status == "cancelled" else "failed"
          payload = {
              "webhook_secret": os.environ.get("WEBHOOK_SECRET", ""),
              "job_id": os.environ.get("JOB_ID", ""),
              "post_id": os.environ.get("POST_ID", ""),
              "platform": os.environ.get("PLATFORM", "pixeldrain"),
              "result_status": result_status,
              "message": f"GitHub Actions ended with job status: {status}. This fallback callback was sent so the queue can continue.",
          }
          if not url:
              print("::warning::WordPress callback URL is missing; the queue watchdog will reconcile this run through GitHub.")
          else:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"WordPress fallback callback: HTTP {response.status}")
              except Exception as error:
                  print(f"::error::Could not send fallback callback to WordPress: {error}")
          PY

