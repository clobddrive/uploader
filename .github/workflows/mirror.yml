name: CLOBD Multi-Cloud Parallel Upload Queue
run-name: "CLOBD Queue Job #${{ github.event.client_payload.job_id }} | ${{ github.event.client_payload.platform }}"

on:
  repository_dispatch:
    types: [mirror_gdrive_file]

# WordPress dispatches no more than 10 processing queue rows at a time.
# Each queue row has its own concurrency group, so different job IDs can use
# separate GitHub-hosted runners in parallel. Duplicate dispatches for the same
# queue job ID remain serialized and are not allowed to cancel an active run.
concurrency:
  group: clobd-upload-job-${{ github.event.client_payload.job_id }}
  cancel-in-progress: false

jobs:
  mirror_file:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # Register the GitHub run ID before checkout/dependency installation.
      # This lets WordPress detect failures that happen before the uploader runs.
      - name: Register GitHub Run with WordPress
        shell: bash
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = os.environ.get("PROGRESS_URL", "").strip()
          payload = {
              "webhook_secret": os.environ.get("WEBHOOK_SECRET", ""),
              "job_id": os.environ.get("JOB_ID", ""),
              "stage": "starting",
              "message": "GitHub Actions runner registered. Preparing the upload job.",
              "github_run_id": os.environ.get("GH_RUN_ID", ""),
          }
          if not url:
              print("::warning::WordPress progress URL is missing; WordPress will locate this run through the GitHub API.")
          else:
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      print(f"WordPress run registration: HTTP {response.status}")
              except Exception as error:
                  print(f"::warning::Could not register GitHub run with WordPress: {error}")
          PY

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip gdown requests requests-toolbelt

      - name: Download and Upload to Selected Provider
        shell: python
        env:
          JOB_ID: ${{ github.event.client_payload.job_id }}
          PLATFORM: ${{ github.event.client_payload.platform }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          GDRIVE_ID: ${{ github.event.client_payload.gdrive_id }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
          DUPLICATE_CHECK_URL: ${{ github.event.client_payload.duplicate_check_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          PROVIDER_CONFIG: ${{ github.event.client_payload.provider_config || github.event.client_payload.pixeldrain_api || '' }}
          FORCE_UPLOAD: ${{ github.event.client_payload.force_upload || 'no' }}
          GOFILE_API_TOKEN: ${{ github.event.client_payload.platform == 'gofile' && secrets.GOFILE_API_TOKEN || '' }}
          BUZZHEAVIER_ACCOUNT_ID: ${{ github.event.client_payload.platform == 'buzzheavier' && secrets.BUZZHEAVIER_ACCOUNT_ID || '' }}
          FUCKINGFAST_ACCOUNT_ID: ${{ github.event.client_payload.platform == 'fuckingfast' && secrets.FUCKINGFAST_ACCOUNT_ID || '' }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          import os
          import sys
          import time
          import traceback
          import requests
          import gdown
          import json
          import re
          import subprocess
          import tempfile
          from urllib.parse import quote, unquote
          from email.message import Message

          JOB_ID = os.environ.get("JOB_ID", "").strip()
          PLATFORM = os.environ.get("PLATFORM", "pixeldrain").strip().lower()
          POST_ID = os.environ.get("POST_ID", "").strip()
          GDRIVE_ID = os.environ.get("GDRIVE_ID", "").strip()
          CALLBACK_URL = os.environ.get("CALLBACK_URL", "").strip()
          PROGRESS_URL = os.environ.get("PROGRESS_URL", "").strip()
          DUPLICATE_CHECK_URL = os.environ.get("DUPLICATE_CHECK_URL", "").strip()
          WEBHOOK_SECRET = os.environ.get("WEBHOOK_SECRET", "").strip()
          PROVIDER_CONFIG = os.environ.get("PROVIDER_CONFIG", "").strip()
          PIXELDRAIN_API = PROVIDER_CONFIG if PLATFORM == "pixeldrain" else ""
          BUZZHEAVIER_REGION = PROVIDER_CONFIG if PLATFORM == "buzzheavier" and PROVIDER_CONFIG else "Asia-Pacific"
          FUCKINGFAST_REGION = PROVIDER_CONFIG if PLATFORM == "fuckingfast" and PROVIDER_CONFIG else "Asia-Pacific"
          FORCE_UPLOAD = os.environ.get("FORCE_UPLOAD", "no").strip().lower() == "yes"
          GOFILE_API_TOKEN = os.environ.get("GOFILE_API_TOKEN", "").strip()
          BUZZHEAVIER_ACCOUNT_ID = os.environ.get("BUZZHEAVIER_ACCOUNT_ID", "").strip()
          FUCKINGFAST_ACCOUNT_ID = os.environ.get("FUCKINGFAST_ACCOUNT_ID", "").strip()
          RUN_ID = os.environ.get("GH_RUN_ID", "").strip()
          try:
              RUN_ATTEMPT = max(1, int(os.environ.get("GH_RUN_ATTEMPT", "1").strip() or "1"))
          except (TypeError, ValueError):
              RUN_ATTEMPT = 1

          HEADERS = {
              "User-Agent": "CLOBD-GitHub-Actions-Multi-Cloud-Queue/1.0",
              "Accept": "application/json",
          }

          def update_progress(stage, message, file_name=""):
              if not PROGRESS_URL or not WEBHOOK_SECRET or not JOB_ID:
                  return
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "job_id": JOB_ID,
                  "stage": stage,
                  "message": message,
                  "file_name": file_name,
                  "github_run_id": RUN_ID,
              }
              try:
                  response = requests.post(PROGRESS_URL, json=payload, headers=HEADERS, timeout=20)
                  response.raise_for_status()
              except Exception as error:
                  print(f"::warning title=Queue Progress Update::{error}")

          def send_final_result(result_status, file_name="", result_url="", message=""):
              if not CALLBACK_URL or not WEBHOOK_SECRET:
                  raise RuntimeError("WordPress callback URL or webhook secret is missing.")
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "job_id": JOB_ID,
                  "post_id": POST_ID,
                  "platform": PLATFORM,
                  "file_name": file_name,
                  "result_url": result_url,
                  "pixeldrain_url": result_url if PLATFORM == "pixeldrain" else "",
                  'gofile_url': result_url if PLATFORM == "gofile" else "",
                  'buzzheavier_url': result_url if PLATFORM == "buzzheavier" else "",
                  'fuckingfast_url': result_url if PLATFORM == "fuckingfast" else "",
                  'result_status': result_status,
                  "message": message,
              }
              response = requests.post(CALLBACK_URL, json=payload, headers=HEADERS, timeout=45)
              response.raise_for_status()
              print(f"::notice title=WordPress Queue Updated::HTTP {response.status_code} - {response.text[:500]}")

          def find_wordpress_duplicate(file_name):
              """Use exact filename plus provider-specific successful queue history."""
              if FORCE_UPLOAD:
                  print(f"::notice title=Forced Re-upload::Bypassing prior {PLATFORM} filename history for {file_name}")
                  return ""
              if not DUPLICATE_CHECK_URL:
                  raise RuntimeError("WordPress duplicate-check endpoint is missing. Upload stopped to avoid duplicate files.")
              response = requests.post(
                  DUPLICATE_CHECK_URL,
                  json={"webhook_secret": WEBHOOK_SECRET, "file_name": file_name, "platform": PLATFORM},
                  headers=HEADERS,
                  timeout=(20, 120),
              )
              response.raise_for_status()
              data = response.json()
              if not isinstance(data, dict) or data.get("success") is not True:
                  raise RuntimeError("WordPress duplicate-check endpoint did not return a valid result.")
              if data.get("duplicate"):
                  return str(data.get("result_url") or data.get("pixeldrain_url") or data.get("gofile_url") or data.get("buzzheavier_url") or data.get("fuckingfast_url") or "").strip()
              return ""

          def request_google_cloud_fast_fallback():
              """Ask the authenticated WordPress queue endpoint for this post's Google Cloud (Fast) URL."""
              if not DUPLICATE_CHECK_URL or not WEBHOOK_SECRET or not POST_ID:
                  raise RuntimeError("Google Drive quota was exceeded, but the WordPress fallback lookup is not configured (missing endpoint, webhook secret, or post ID).")
              payload = {
                  "action": "get_google_cloud_fast_fallback",
                  "webhook_secret": WEBHOOK_SECRET,
                  "post_id": POST_ID,
              }
              response = requests.post(
                  DUPLICATE_CHECK_URL,
                  json=payload,
                  headers=HEADERS,
                  timeout=(20, 60),
              )
              if response.status_code != 200:
                  detail = response.text[:700] if response.text else "No response body"
                  raise RuntimeError(f"WordPress could not return the Google Cloud (Fast) fallback URL (HTTP {response.status_code}): {detail}")
              try:
                  data = response.json()
              except ValueError as error:
                  raise RuntimeError("WordPress returned invalid JSON while looking up the Google Cloud (Fast) fallback URL.") from error
              if not isinstance(data, dict) or not data.get("success") or not data.get("fallback_available"):
                  detail = str(data.get("error") or "No Google Cloud (Fast) link is saved in this File post.") if isinstance(data, dict) else "Unexpected WordPress response."
                  raise RuntimeError(f"Google Drive download quota was exceeded, and the File post has no usable Google Cloud (Fast) fallback: {detail}")
              fallback_url = str(data.get("fallback_url") or "").strip()
              from urllib.parse import urlparse
              parsed = urlparse(fallback_url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise RuntimeError("WordPress returned an invalid Google Cloud (Fast) fallback URL. HTTPS is required.")
              data["fallback_url"] = fallback_url
              return data

          def _filename_from_content_disposition(header_value):
              if not header_value:
                  return ""
              message = Message()
              message["content-disposition"] = header_value
              value = message.get_filename()
              return unquote(str(value)).strip() if value else ""

          def _safe_local_filename(value):
              value = str(value or "").replace("\\", "/").split("/")[-1]
              value = re.sub(r"[\x00-\x1f\x7f]", "", value).strip()
              if value in ("", ".", ".."):
                  return ""
              return value

          def download_from_google_cloud_fast(fallback_info, download_dir):
              """Stream the saved Cloudflare Worker URL to disk without buffering the file in RAM."""
              fallback_url = fallback_info["fallback_url"]
              expected_name = _safe_local_filename(fallback_info.get("file_name"))
              part_path = os.path.join(download_dir, f".clobd-fallback-{JOB_ID}.part")
              total_written = 0
              expected_content_length = 0
              last_progress_time = 0.0
              last_progress_bytes = 0
              try:
                  with requests.get(
                      fallback_url,
                      headers={"User-Agent": HEADERS["User-Agent"], "Accept": "*/*"},
                      stream=True,
                      allow_redirects=True,
                      timeout=(30, 300),
                  ) as response:
                      if response.status_code != 200:
                          raise RuntimeError(f"Google Cloud (Fast) download failed (HTTP {response.status_code}): {response.text[:500]}")
                      from urllib.parse import urlparse
                      if urlparse(response.url).scheme != "https":
                          raise RuntimeError("Google Cloud (Fast) redirected to a non-HTTPS address. Download was blocked for security.")
                      content_type = str(response.headers.get("Content-Type", "")).split(";", 1)[0].strip().lower()
                      try:
                          expected_content_length = int(response.headers.get("Content-Length", "0") or 0)
                      except (TypeError, ValueError):
                          expected_content_length = 0
                      header_name = _safe_local_filename(_filename_from_content_disposition(response.headers.get("Content-Disposition", "")))
                      file_name = expected_name or header_name
                      if not file_name:
                          raise RuntimeError("Google Cloud (Fast) did not provide a filename, and the WordPress File post has no usable source filename.")

                      chunk_iterator = iter(response.iter_content(chunk_size=8 * 1024 * 1024))
                      first_chunk = next(chunk_iterator, b"")
                      preview = (first_chunk or b"").lstrip()[:160].lower()
                      looks_like_error_document = preview.startswith((b"<!doctype html", b"<html", b"{\"error\"", b"{\n  \"error\"", b"{\"success\":false", b"[\"error\""))
                      if content_type in ("text/html", "application/json") or looks_like_error_document:
                          raise RuntimeError(f"Google Cloud (Fast) returned an HTML/JSON response instead of the file ({content_type or 'unknown content type'}). The signed Worker URL may have expired or returned an error page.")

                      with open(part_path, "wb") as output:
                          if first_chunk:
                              output.write(first_chunk)
                              total_written += len(first_chunk)
                          for chunk in chunk_iterator:
                              if not chunk:
                                  continue
                              output.write(chunk)
                              total_written += len(chunk)
                              now = time.time()
                              if total_written - last_progress_bytes >= 64 * 1024 * 1024 or now - last_progress_time >= 30:
                                  last_progress_bytes = total_written
                                  last_progress_time = now
                                  if expected_content_length > 0:
                                      percent = min(99, int((total_written / expected_content_length) * 100))
                                      message = f"Downloading from Google Cloud (Fast) ({percent}% · {total_written / (1024 ** 2):.0f} MiB)."
                                  else:
                                      message = f"Downloading from Google Cloud (Fast) ({total_written / (1024 ** 2):.0f} MiB received)."
                                  update_progress("downloading_fallback", message, file_name)

                  if total_written <= 0 or not os.path.isfile(part_path):
                      raise RuntimeError("Google Cloud (Fast) returned an empty file. Upload cancelled.")
                  if expected_content_length > 0 and total_written != expected_content_length:
                      raise RuntimeError(f"Google Cloud (Fast) download was incomplete: expected {expected_content_length} bytes, received {total_written} bytes.")
                  final_path = os.path.join(download_dir, file_name)
                  os.replace(part_path, final_path)
                  return final_path
              except Exception:
                  try:
                      if os.path.exists(part_path):
                          os.remove(part_path)
                  except OSError:
                      pass
                  raise

          def is_google_drive_quota_error(error_text):
              text = str(error_text or "").casefold()
              quota_markers = (
                  "too many users have viewed or downloaded this file recently",
                  "download quota exceeded",
                  "download quota has been exceeded",
                  "user rate limit exceeded",
                  "too many users",
              )
              return any(marker in text for marker in quota_markers)

          def find_exact_pixeldrain_duplicate(file_name):
              """Return (file_id, url) for an exact-name match in the Pixeldrain API account."""
              response = requests.get(
                  "https://pixeldrain.com/api/user/files",
                  auth=("", PIXELDRAIN_API),
                  headers=HEADERS,
                  timeout=(20, 90),
              )
              response.raise_for_status()
              try:
                  data = response.json()
              except ValueError as error:
                  raise RuntimeError("Pixeldrain account file-list API returned invalid JSON.") from error
              files = data.get("files") if isinstance(data, dict) else None
              if not isinstance(files, list):
                  raise RuntimeError("Pixeldrain account file-list API did not return a valid files array. Upload stopped to prevent a duplicate.")
              for item in files:
                  if isinstance(item, dict) and item.get("name") == file_name and item.get("id"):
                      file_id = str(item["id"]).strip()
                      return file_id, f"https://pixeldrain.com/u/{quote(file_id, safe='')}"
              return "", ""

          file_name = ""
          result_url = ""
          final_sent = False

          try:
              if not JOB_ID or not POST_ID or not GDRIVE_ID:
                  raise RuntimeError("Queue job ID, WordPress post ID, or Google Drive file ID is missing.")
              if PLATFORM not in ("pixeldrain", "gofile", "buzzheavier", "fuckingfast"):
                  raise RuntimeError(f"Unsupported upload platform: {PLATFORM}")
              if PLATFORM == "pixeldrain" and not PIXELDRAIN_API:
                  raise RuntimeError("Pixeldrain API key is missing. Configure it in WordPress > Files > Settings.")
              if PLATFORM == "gofile" and not GOFILE_API_TOKEN:
                  raise RuntimeError("GitHub Actions secret GOFILE_API_TOKEN is missing. Save the Gofile token in WordPress > Files > Settings and verify that GitHub Secrets permission is enabled.")
              if PLATFORM == "buzzheavier" and not BUZZHEAVIER_ACCOUNT_ID:
                  raise RuntimeError("GitHub Actions secret BUZZHEAVIER_ACCOUNT_ID is missing. Enter your BUZZHEAVIER Account ID in WordPress > Files > Settings and validate/sync it.")
              if PLATFORM == "fuckingfast" and not FUCKINGFAST_ACCOUNT_ID:
                  raise RuntimeError("GitHub Actions secret FUCKINGFAST_ACCOUNT_ID is missing. Enter your FUCKINGFAST Account ID in WordPress > Files > Settings and validate/sync it.")

              download_dir = os.path.abspath("downloads")
              os.makedirs(download_dir, exist_ok=True)
              os.chdir(download_dir)

              update_progress("downloading", "Downloading the source file from Google Drive.")
              print(f"::notice title=Queue Job::Job #{JOB_ID} | Post #{POST_ID} | Platform: {PLATFORM}")
              drive_url = f"https://drive.google.com/uc?id={GDRIVE_ID}"
              downloaded_path = ""
              try:
                  downloaded_path = gdown.download(drive_url, quiet=False)
              except Exception as gdrive_error:
                  gdrive_error_text = str(gdrive_error)
                  if not is_google_drive_quota_error(gdrive_error_text):
                      raise
                  print("::warning title=Google Drive Download Quota::Google Drive blocked this file because its recent download/view quota was exceeded. Trying the Google Cloud (Fast) link saved in the same CLOBD File post.")
                  update_progress("downloading_fallback", "Google Drive download quota exceeded. Looking up the Google Cloud (Fast) fallback in this File post.")
                  fallback_info = request_google_cloud_fast_fallback()
                  print(f"::notice title=Download Fallback::Found Google Cloud (Fast) link in post #{POST_ID}; downloading the alternate source.")
                  downloaded_path = download_from_google_cloud_fast(fallback_info, download_dir)
                  print("::notice title=Download Fallback Complete::Google Cloud (Fast) download completed; continuing with the existing provider upload flow.")
              if not downloaded_path or not os.path.isfile(downloaded_path):
                  raise RuntimeError("Google Drive file could not be downloaded. Check access permissions and the source link.")

              file_path = os.path.abspath(downloaded_path)
              file_name = os.path.basename(file_path)
              if not file_name:
                  raise RuntimeError("Google Drive returned an empty filename.")
              file_size = os.path.getsize(file_path)
              if file_size <= 0:
                  raise RuntimeError("Downloaded file is empty. Upload cancelled.")
              file_size_gb = round(file_size / (1024 ** 3), 3)
              print(f"::notice title=Downloaded::{file_name} | {file_size_gb} GiB")

              if PLATFORM == "fuckingfast":
                  # FUCKINGFAST links can expire or be deleted while their old
                  # WordPress history remains. Never reuse a saved FF URL based
                  # only on filename/history; this provider must perform a fresh
                  # upload and verify the newly-created public link.
                  update_progress("checking_account", "FUCKINGFAST: bypassing old filename history and preparing a fresh account upload.", file_name)
                  print(f"::notice title=FUCKINGFAST Fresh Upload::Skipping WordPress filename/history duplicate checks for {file_name}.")
                  existing_url = ""
              else:
                  update_progress("checking_duplicate", f"Checking {PLATFORM} for an exact filename match.", file_name)
                  existing_url = find_wordpress_duplicate(file_name)
              if existing_url:
                  result_url = existing_url
                  message = f"Skipped upload: this exact filename already has a successful {PLATFORM} link in CLOBD upload history. Reusing its saved link."
                  print(f"::notice title=Duplicate Skipped::{file_name} already exists in CLOBD {PLATFORM} history")
                  update_progress("finishing", message, file_name)
                  send_final_result("skipped_duplicate", file_name, result_url, message)
                  final_sent = True
                  sys.exit(0)

              if PLATFORM == "pixeldrain":
                  existing_id, existing_url = ("", "") if FORCE_UPLOAD else find_exact_pixeldrain_duplicate(file_name)
                  if existing_id:
                      result_url = existing_url
                      message = "Skipped upload: a file with this exact filename already exists in the Pixeldrain account. Reusing its existing link."
                      print(f"::notice title=Duplicate Skipped::{file_name} already exists as {existing_id}")
                      update_progress("finishing", message, file_name)
                      send_final_result("skipped_duplicate", file_name, result_url, message)
                      final_sent = True
                      sys.exit(0)

                  update_progress("uploading", f"Uploading {file_name} ({file_size_gb} GiB) to Pixeldrain.", file_name)
                  encoded_name = quote(file_name, safe="")
                  upload_url = f"https://pixeldrain.com/api/file/{encoded_name}"
                  with open(file_path, "rb") as file_handle:
                      upload_response = requests.put(
                          upload_url,
                          auth=("", PIXELDRAIN_API),
                          data=file_handle,
                          headers=HEADERS,
                          timeout=(30, 7200),
                      )
                  try:
                      upload_data = upload_response.json()
                  except ValueError:
                      upload_data = {}
                  if upload_response.status_code not in (200, 201) or not upload_data.get("id"):
                      details = upload_response.text[:1000] if upload_response.text else "No response body"
                      raise RuntimeError(f"Pixeldrain upload failed (HTTP {upload_response.status_code}): {details}")
                  file_id = str(upload_data["id"]).strip()
                  result_url = f"https://pixeldrain.com/u/{quote(file_id, safe='')}"
                  message = f"Pixeldrain upload completed successfully. File size: {file_size_gb} GiB."

              elif PLATFORM == "gofile":
                  # Gofile content-list/search API access is Premium-only. To avoid an
                  # unsafe partial account scan, duplicate protection here uses the
                  # exact filename history managed by this WordPress queue.
                  update_progress("uploading", f"Streaming {file_name} ({file_size_gb} GiB) to Gofile.", file_name)
                  from requests_toolbelt.multipart.encoder import MultipartEncoder, MultipartEncoderMonitor

                  last_progress_bytes = [0]
                  last_progress_time = [0.0]
                  with open(file_path, "rb") as file_handle:
                      encoder = MultipartEncoder(fields={
                          "file": (file_name, file_handle, "application/octet-stream"),
                      })
                      def report_gofile_progress(monitor):
                          now = time.time()
                          if (monitor.bytes_read - last_progress_bytes[0] >= 32 * 1024 * 1024) or (now - last_progress_time[0] >= 30):
                              last_progress_bytes[0] = monitor.bytes_read
                              last_progress_time[0] = now
                              percent = min(99, int((monitor.bytes_read / max(1, monitor.len)) * 100))
                              update_progress("uploading", f"Uploading {file_name} to Gofile ({percent}% sent).", file_name)
                      monitor = MultipartEncoderMonitor(encoder, report_gofile_progress)
                      gofile_headers = dict(HEADERS)
                      gofile_headers["Authorization"] = f"Bearer {GOFILE_API_TOKEN}"
                      gofile_headers["Content-Type"] = monitor.content_type
                      upload_response = requests.post(
                          "https://upload.gofile.io/uploadfile",
                          data=monitor,
                          headers=gofile_headers,
                          timeout=(30, 7200),
                      )
                  try:
                      upload_data = upload_response.json()
                  except ValueError as error:
                      raise RuntimeError(f"Gofile returned invalid JSON (HTTP {upload_response.status_code}): {upload_response.text[:1000]}") from error
                  if upload_response.status_code not in (200, 201) or not isinstance(upload_data, dict) or upload_data.get("status") != "ok":
                      error_status = upload_data.get("status") if isinstance(upload_data, dict) else "unknown"
                      raise RuntimeError(f"Gofile upload failed (HTTP {upload_response.status_code}, status {error_status}): {upload_response.text[:1200]}")
                  data = upload_data.get("data") if isinstance(upload_data.get("data"), dict) else {}
                  result_url = str(data.get("downloadPage") or "").strip()
                  if not result_url and data.get("code"):
                      result_url = f"https://gofile.io/d/{data['code']}"
                  if not result_url.startswith("https://gofile.io/"):
                      raise RuntimeError("Gofile reported success but did not return a valid public downloadPage URL.")
                  message = f"Gofile upload completed successfully. File size: {file_size_gb} GiB."

              elif PLATFORM == "buzzheavier":
                  # Authenticated account upload. The Account ID is injected only
                  # from the encrypted GitHub Actions secret (never client_payload).
                  allowed_regions = {
                      "Asia-Pacific", "Western Europe", "Eastern Europe",
                      "Central Europe", "Eastern US", "Western US",
                  }
                  if BUZZHEAVIER_REGION not in allowed_regions:
                      raise RuntimeError(f"Unsupported BUZZHEAVIER storage region: {BUZZHEAVIER_REGION}")
                  if not BUZZHEAVIER_ACCOUNT_ID:
                      raise RuntimeError("BUZZHEAVIER_ACCOUNT_ID GitHub Actions secret is missing.")

                  # BUZZHEAVIER validates the filename parsed from the URL path.
                  # CLOBD source names commonly use vertical bars as separators
