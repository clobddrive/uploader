name: Auto Mirror Google Drive to Cloudon:repository_dispatch:types: [mirror_gdrive_file]concurrency:group: mega-cloud-mirror-queue-${{ github.event.client_payload.post_id || github.run_id }}cancel-in-progress: falsejobs:mirror_file:runs-on: ubuntu-24.04timeout-minutes: 15concurrency:group: global-mega-upload-lockcancel-in-progress: falsesteps:
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install Dependencies & MEGAcmd
    run: |
      python3 -m pip install --upgrade pip gdown requests
      wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb"
      sudo apt-get update -qq
      sudo apt-get install -y -qq "./megacmd-xUbuntu_24.04_amd64.deb" || sudo apt-get install -f -y -qq

  - name: Run Fast Auto Upload Script
    shell: python
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      POST_ID: ${{ github.event.client_payload.post_id }}
      GDRIVE_ID: ${{ github.event.client_payload.gdrive_id }}
      GDRIVE_API_KEY: ${{ github.event.client_payload.gdrive_api_key }}
      NEED_PD: ${{ github.event.client_payload.need_pd }}
      NEED_MEGA: ${{ github.event.client_payload.need_mega }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      PROGRESS_URL: ${{ github.event.client_payload.progress_url }}
      WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
      PIXELDRAIN_API: ${{ github.event.client_payload.pixeldrain_api }}
      MEGA_ACCOUNTS: ${{ github.event.client_payload.mega_accounts }}
    run: |
      import os, sys, re, subprocess, urllib.parse, requests, gdown

      RUN_ID = os.environ.get("GITHUB_RUN_ID", "").strip()
      POST_ID = os.environ.get("POST_ID", "").strip()
      GDRIVE_ID = os.environ.get("GDRIVE_ID", "").strip()
      GDRIVE_API_KEY = os.environ.get("GDRIVE_API_KEY", "").strip()
      NEED_PD = os.environ.get("NEED_PD", "yes").strip()
      NEED_MEGA = os.environ.get("NEED_MEGA", "yes").strip()
      CALLBACK_URL = os.environ.get("CALLBACK_URL", "").strip()
      PROGRESS_URL = os.environ.get("PROGRESS_URL", "").strip()
      WEBHOOK_SECRET = os.environ.get("WEBHOOK_SECRET", "").strip()
      PIXELDRAIN_API = os.environ.get("PIXELDRAIN_API", "").strip()
      MEGA_ACCOUNTS_RAW = os.environ.get("MEGA_ACCOUNTS", "").strip()

      # Mask secrets in logs
      for sec in [GDRIVE_API_KEY, WEBHOOK_SECRET, PIXELDRAIN_API]:
          if sec:
              print(f"::add-mask::{sec}")
      for line in MEGA_ACCOUNTS_RAW.splitlines():
          if ":" in line:
              print(f"::add-mask::{line.strip()}")

      def kill_mega_server():
          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=10)
          subprocess.run(["pkill", "-9", "-f", "mega-cmd"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

      def report_progress(stage_text, fname=""):
          print(stage_text)
          if not PROGRESS_URL:
              return
          try:
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "post_id": POST_ID,
                  "github_run_id": RUN_ID,
                  "stage": stage_text,
                  "file_name": fname
              }
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              r = requests.post(PROGRESS_URL, json=payload, headers=headers, timeout=15)
              if r.status_code == 200 and r.json().get("abort"):
                  print("Aborted by WordPress Admin!")
                  kill_mega_server()
                  sys.exit(0)
          except Exception as e:
              print(f"Progress update note: {e}")

      def notify_wordpress(file_name="", pd_url="", mega_url="", mega_acc="", error_msg=""):
          if not CALLBACK_URL:
              return
          try:
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "post_id": POST_ID,
                  "file_name": file_name,
                  "pixeldrain_url": pd_url,
                  "mega_url": mega_url,
                  "mega_account": mega_acc,
                  "error_message": error_msg
              }
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              cb = requests.post(CALLBACK_URL, json=payload, headers=headers, timeout=25)
              print(f"WordPress Callback: {cb.status_code}")
          except Exception as e:
              print(f"Callback Error: {e}")

      DOWNLOAD_DIR = os.path.abspath("downloads")
      os.makedirs(DOWNLOAD_DIR, exist_ok=True)
      os.chdir(DOWNLOAD_DIR)

      # ১. Google Drive থেকে ডাউনলোড (Live Progress সহ)
      report_progress("⬇️ Downloading file from Google Drive...")
      file_path = ""
      file_name = ""

      if GDRIVE_API_KEY:
          try:
              meta_url = f"https://www.googleapis.com/drive/v3/files/{GDRIVE_ID}?fields=name,size&supportsAllDrives=true&key={GDRIVE_API_KEY}"
              m_res = requests.get(meta_url, timeout=15)
              if m_res.status_code == 200 and m_res.json().get("name"):
                  file_name = m_res.json()["name"]
                  report_progress(f"⬇️ Downloading via Drive API: {file_name}", file_name)
                  dl_url = f"https://www.googleapis.com/drive/v3/files/{GDRIVE_ID}?alt=media&supportsAllDrives=true&key={GDRIVE_API_KEY}"
                  subprocess.run(["curl", "-sS", "-L", "--fail", "--retry", "2", "-o", file_name, dl_url], check=True, timeout=360)
                  if os.path.exists(file_name) and os.path.getsize(file_name) > 1024:
                      file_path = os.path.abspath(file_name)
          except Exception as e:
              print(f"API Download Fallback to gdown: {e}")

      if not file_path:
          try:
              url = f"https://drive.google.com/uc?id={GDRIVE_ID}"
              gdown.download(url, quiet=False)
              files = [f for f in os.listdir(DOWNLOAD_DIR) if not f.endswith(".part")]
              if files:
                  file_path = os.path.join(DOWNLOAD_DIR, files[0])
          except Exception as e:
              print(f"::error title=Google Drive Exception::{e}")

      if not file_path or not os.path.exists(file_path):
          notify_wordpress(error_msg="Google Drive download failed or quota exceeded.")
          sys.exit(1)

      file_name = os.path.basename(file_path)
      file_size = os.path.getsize(file_path)
      file_size_gb = round(file_size / (1024**3), 3)

      # ২. Pixeldrain-এ আপলোড
      pixeldrain_url = ""
      if NEED_PD == "yes" and PIXELDRAIN_API:
          report_progress(f"🟣 Uploading to Pixeldrain ({file_size_gb} GB)...", file_name)
          try:
              encoded_name = urllib.parse.quote(file_name)
              pd_api_url = f"https://pixeldrain.com/api/file/{encoded_name}"
              with open(file_path, "rb") as f:
                  res = requests.put(pd_api_url, auth=("", PIXELDRAIN_API), data=f, timeout=360)
              if res.status_code in [200, 201] and res.json().get("id"):
                  pixeldrain_url = f"https://pixeldrain.com/u/{res.json()['id']}"
                  print("::notice title=Pixeldrain Success::Uploaded")
          except Exception as e:
              print(f"::warning title=Pixeldrain Exception::{e}")

      # ৩. MEGA-তে ১৯.৮ জিবি (19.8 GB) স্মার্ট চেক ও আপলোড
      mega_url = ""
      used_mega_account = ""
      MAX_LIMIT_BYTES = int(19.8 * (1024**3))

      def get_mega_used_bytes():
          df_cmd = subprocess.run(["mega-df"], capture_output=True, text=True, timeout=25)
          out = df_cmd.stdout
          m_bytes = re.search(r"USED STORAGE:\s+(\d+)", out, re.IGNORECASE)
          if m_bytes:
              return int(m_bytes.group(1))
          m_pct = re.search(r"([\d.]+)%\s+of\s+([\d.]+)\s*GB", out, re.IGNORECASE)
          if m_pct:
              return int((float(m_pct.group(1)) / 100.0) * float(m_pct.group(2)) * (1024**3))
          return None

      if NEED_MEGA == "yes" and MEGA_ACCOUNTS_RAW:
          accounts = [line.strip() for line in MEGA_ACCOUNTS_RAW.splitlines() if ":" in line.strip()]
          for idx, acc in enumerate(accounts, start=1):
              email, password = acc.split(":", 1)
              email, password = email.strip(), password.strip()
              report_progress(f"🔴 Checking MEGA Account #{idx} space...", file_name)

              try:
                  subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
                  login = subprocess.run(["mega-login", email, password], capture_output=True, text=True, timeout=35)
                  if login.returncode != 0:
                      continue

                  subprocess.run(["mega-rm", "-r", "-f", "//bin/*"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=20)

                  used_bytes = get_mega_used_bytes()
                  if used_bytes is None or (used_bytes + file_size) > MAX_LIMIT_BYTES:
                      continue

                  report_progress(f"🔴 Uploading to MEGA Account #{idx} ({file_size_gb} GB)...", file_name)
                  subprocess.run(["mega-rm", "-f", f"/{file_name}"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
                  put_cmd = subprocess.run(["mega-put", file_path, "/"], capture_output=True, text=True, timeout=420)
                  if put_cmd.returncode != 0:
                      continue

                  exp = subprocess.run(["mega-export", "-a", f"/{file_name}"], capture_output=True, text=True, check=True, timeout=25)
                  match = re.search(r"(https://mega\.nz/\S+)", exp.stdout)
                  if match:
                      mega_url = match.group(1)
                      used_mega_account = email
                      break
              except Exception as e:
                  print(f"MEGA Account #{idx} error: {e}")
                  continue

      kill_mega_server()

      if not pixeldrain_url and not mega_url:
          notify_wordpress(file_name=file_name, error_msg="Upload failed on both Pixeldrain and MEGA.")
          sys.exit(1)

      report_progress("✅ Saving links to WordPress...", file_name)
      notify_wordpress(file_name=file_name, pd_url=pixeldrain_url, mega_url=mega_url, mega_acc=used_mega_account)

  - name: Force Clean Up MEGA Daemon
    if: always()
    run: pkill -9 -f mega-cmd || true
