name: Auto Mirror Google Drive to CLOBD Backups

run-name: >-
  CLOBD Queue ${{ github.event.client_payload.queue_id || 'legacy' }} - Post #${{ github.event.client_payload.post_id || 'unknown' }}

on:
  repository_dispatch:
    types: [mirror_gdrive_file]

# WordPress dispatches only one queue item at a time. This is a second safety
# layer so two accidental/manual GitHub dispatches cannot upload concurrently.
concurrency:
  group: clobd-cloud-mirror-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  mirror_file:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Register GitHub Run ID in WordPress Queue
        id: report_queue
        env:
          QUEUE_ID: ${{ github.event.client_payload.queue_id }}
          RUN_ID: ${{ github.run_id }}
          STATUS_URL: ${{ github.event.client_payload.status_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          status_url = os.environ.get("STATUS_URL", "").strip()
          queue_id = os.environ.get("QUEUE_ID", "").strip()
          if status_url and queue_id:
              payload = {
                  "webhook_secret": os.environ.get("WEBHOOK_SECRET", ""),
                  "queue_id": queue_id,
                  "run_id": os.environ.get("RUN_ID", ""),
                  "stage": "GitHub Actions runner started",
                  "platform": "Preparing",
                  "message": "GitHub Run ID registered. Preparing dependencies."
              }
              request = urllib.request.Request(
                  status_url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json", "User-Agent": "CLOBD-GitHub-Actions-Mirror"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(request, timeout=25) as response:
                      print("WordPress queue status:", response.status, response.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  try:
                      response_data = json.loads(body)
                  except ValueError:
                      response_data = {}
                  if error.code == 409 and response_data.get("cancelled"):
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("cancelled=true\n")
                      print("Queue item was already cancelled in WordPress; remaining steps will be skipped.")
                  else:
                      raise
          PY

      - name: Install Python Dependencies and MEGAcmd
        if: steps.report_queue.outputs.cancelled != 'true'
        run: |
          python3 -m pip install --upgrade pip gdown requests
          wget -q "https://mega.nz/linux/repo/xUbuntu_24.04/amd64/megacmd-xUbuntu_24.04_amd64.deb"
          sudo apt-get update
          sudo apt-get install -y "./megacmd-xUbuntu_24.04_amd64.deb" || sudo apt-get install -f -y

      - name: Download from Google Drive and Upload Selected Backups
        if: steps.report_queue.outputs.cancelled != 'true'
        shell: python
        env:
          QUEUE_ID: ${{ github.event.client_payload.queue_id }}
          RUN_ID: ${{ github.run_id }}
          POST_ID: ${{ github.event.client_payload.post_id }}
          GDRIVE_ID: ${{ github.event.client_payload.gdrive_id }}
          NEED_PD: ${{ github.event.client_payload.need_pd }}
          NEED_MEGA: ${{ github.event.client_payload.need_mega }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          STATUS_URL: ${{ github.event.client_payload.status_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          PIXELDRAIN_API: ${{ github.event.client_payload.pixeldrain_api }}
          MEGA_ACCOUNTS: ${{ github.event.client_payload.mega_accounts }}
        run: |
          import os
          import re
          import sys
          import subprocess
          import urllib.parse
          import requests
          import gdown

          QUEUE_ID = os.environ.get("QUEUE_ID", "").strip()
          RUN_ID = os.environ.get("RUN_ID", "").strip()
          POST_ID = os.environ.get("POST_ID", "").strip()
          GDRIVE_ID = os.environ.get("GDRIVE_ID", "").strip()
          NEED_PD = os.environ.get("NEED_PD", "no").strip().lower() == "yes"
          NEED_MEGA = os.environ.get("NEED_MEGA", "no").strip().lower() == "yes"
          CALLBACK_URL = os.environ.get("CALLBACK_URL", "").strip()
          STATUS_URL = os.environ.get("STATUS_URL", "").strip()
          WEBHOOK_SECRET = os.environ.get("WEBHOOK_SECRET", "").strip()
          PIXELDRAIN_API = os.environ.get("PIXELDRAIN_API", "").strip()
          MEGA_ACCOUNTS_RAW = os.environ.get("MEGA_ACCOUNTS", "").strip()

          DOWNLOAD_DIR = os.path.abspath("downloads")
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          class JobCancelled(Exception):
              pass

          def send_status(stage, platform="", message=""):
              """Send live stage/platform information to the WordPress Queue page."""
              if not STATUS_URL or not QUEUE_ID:
                  return
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "queue_id": QUEUE_ID,
                  "run_id": RUN_ID,
                  "stage": stage,
                  "platform": platform,
                  "message": message,
              }
              response = requests.post(STATUS_URL, json=payload, timeout=25)
              if response.status_code == 409:
                  raise JobCancelled("This job was cancelled from the WordPress dashboard.")
              response.raise_for_status()
              try:
                  if response.json().get("cancelled"):
                      raise JobCancelled("This job was cancelled from the WordPress dashboard.")
              except ValueError:
                  pass

          def send_final_callback(file_name, pd_url, mega_url, mega_account,
                                 pd_status, mega_status, message=""):
              if not CALLBACK_URL:
                  raise RuntimeError("WordPress callback URL is missing.")
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "queue_id": QUEUE_ID,
                  "post_id": POST_ID,
                  "file_name": file_name or "",
                  "pixeldrain_url": pd_url or "",
                  "mega_url": mega_url or "",
                  "mega_account": mega_account or "",
                  "pd_status": pd_status,
                  "mega_status": mega_status,
                  "message": message,
              }
              response = requests.post(
                  CALLBACK_URL,
                  json=payload,
                  headers={"User-Agent": "CLOBD-GitHub-Actions-Mirror"},
                  timeout=60,
              )
              response.raise_for_status()
              print("WordPress callback accepted:", response.status_code)

          def get_mega_used_bytes():
              result = subprocess.run(
                  ["mega-df"], capture_output=True, text=True, timeout=60
              )
              output = (result.stdout or "") + "\n" + (result.stderr or "")

              # Some MEGAcmd versions report the used bytes directly.
              match = re.search(r"USED STORAGE:\s*(\d+)", output, re.IGNORECASE)
              if match:
                  return int(match.group(1))

              # Fallback for percentage/total output.
              match = re.search(
                  r"([\d.]+)%\s+of\s+([\d.]+)\s*GB", output, re.IGNORECASE
              )
              if match:
                  pct = float(match.group(1))
                  total_gb = float(match.group(2))
                  return int((pct / 100.0) * total_gb * (1024 ** 3))
              return None

          def upload_to_pixeldrain(file_path, file_name):
              if not PIXELDRAIN_API:
                  raise RuntimeError("Pixeldrain API key is not configured in WordPress.")
              encoded_name = urllib.parse.quote(file_name, safe="")
              api_url = f"https://pixeldrain.com/api/file/{encoded_name}"
              with open(file_path, "rb") as file_handle:
                  response = requests.put(
                      api_url,
                      auth=("", PIXELDRAIN_API),
                      data=file_handle,
                      timeout=(30, 7200),
                  )
              try:
                  data = response.json()
              except ValueError:
                  data = {}
              if response.status_code not in (200, 201) or not data.get("id"):
                  raise RuntimeError(
                      f"Pixeldrain HTTP {response.status_code}: {response.text[:1000]}"
                  )
              return "https://pixeldrain.com/u/" + str(data["id"])

          def upload_to_mega(file_path, file_name, file_size):
              accounts = [
                  line.strip()
                  for line in MEGA_ACCOUNTS_RAW.splitlines()
                  if ":" in line.strip()
              ]
              if not accounts:
                  raise RuntimeError("No MEGA accounts are configured in WordPress.")

              max_limit_bytes = int(19.8 * (1024 ** 3))
              last_error = "No MEGA account had enough storage or could upload."

              for index, account in enumerate(accounts, start=1):
                  email, password = account.split(":", 1)
                  email = email.strip()
                  password = password.strip()
                  print(f"Checking MEGA account {index}/{len(accounts)}: {email}")
                  subprocess.run(
                      ["mega-logout"], stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL, timeout=30
                  )

                  try:
                      login = subprocess.run(
                          ["mega-login", email, password],
                          capture_output=True, text=True, timeout=90
                      )
                      if login.returncode != 0:
                          last_error = f"MEGA login failed for {email}: {(login.stderr or login.stdout)[:500]}"
                          print("::warning::", last_error)
                          continue

                      # Keep the existing rubbish-bin cleanup behaviour.
                      subprocess.run(
                          ["mega-rm", "-r", "-f", "//bin/*"],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=120
                      )

                      used_bytes = get_mega_used_bytes()
                      if used_bytes is None:
                          last_error = f"Could not read MEGA storage for {email}; trying next account."
                          print("::warning::", last_error)
                          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          continue

                      projected_bytes = used_bytes + file_size
                      used_gb = round(used_bytes / (1024 ** 3), 2)
                      projected_gb = round(projected_bytes / (1024 ** 3), 2)
                      print(
                          f"MEGA account {email}: used {used_gb} GB, "
                          f"projected {projected_gb} GB / 19.8 GB"
                      )

                      if projected_bytes > max_limit_bytes:
                          last_error = f"Not enough available storage in {email}; trying next account."
                          print("::notice::", last_error)
                          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          continue

                      send_status("Uploading file to MEGA", "mega", f"Uploading to {email}")
                      remote_path = "/" + file_name
                      subprocess.run(
                          ["mega-rm", "-f", remote_path],
                          stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                          timeout=60
                      )
                      put_result = subprocess.run(
                          ["mega-put", file_path, "/"],
                          capture_output=True, text=True, timeout=7200
                      )
                      if put_result.returncode != 0:
                          last_error = f"MEGA upload failed for {email}: {(put_result.stderr or put_result.stdout)[:700]}"
                          print("::warning::", last_error)
                          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          continue

                      export_result = subprocess.run(
                          ["mega-export", "-a", remote_path],
                          capture_output=True, text=True, timeout=120
                      )
                      if export_result.returncode != 0:
                          last_error = f"MEGA export failed for {email}: {(export_result.stderr or export_result.stdout)[:700]}"
                          print("::warning::", last_error)
                          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          continue

                      match = re.search(r"(https://mega\.nz/\S+)", export_result.stdout or "")
                      if not match:
                          last_error = f"MEGA uploaded to {email}, but no public link was returned."
                          print("::warning::", last_error)
                          subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                          continue

                      link = match.group(1).rstrip("\r\n")
                      subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      return link, email

                  except JobCancelled:
                      subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      raise
                  except Exception as error:
                      last_error = f"MEGA account {email} error: {error}"
                      print("::warning::", last_error)
                      subprocess.run(["mega-logout"], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      continue

              raise RuntimeError(last_error)

          pd_status = "pending" if NEED_PD else "skipped"
          mega_status = "pending" if NEED_MEGA else "skipped"
          pixeldrain_url = ""
          mega_url = ""
          used_mega_account = ""
          file_path = ""
          file_name = ""
          errors = []
          download_ok = False

          try:
              if not POST_ID or not GDRIVE_ID:
                  raise RuntimeError("Post ID or Google Drive file ID is missing.")
              if not NEED_PD and not NEED_MEGA:
                  raise RuntimeError("No upload destination was selected for this queue job.")

              send_status("GitHub runner started", "Preparing", "Runner is starting the file job.")
              send_status("Downloading source from Google Drive", "Google Drive", "Downloading the source file.")

              drive_url = f"https://drive.google.com/uc?id={GDRIVE_ID}"
              downloaded_path = gdown.download(
                  url=drive_url, output=None, quiet=False, fuzzy=True
              )
              if not downloaded_path or not os.path.isfile(downloaded_path):
                  raise RuntimeError("Google Drive download failed or returned no file.")

              file_path = os.path.abspath(downloaded_path)
              file_name = os.path.basename(file_path)
              file_size = os.path.getsize(file_path)
              if file_size <= 0:
                  raise RuntimeError("The downloaded file is empty.")
              download_ok = True
              print(
                  f"::notice title=Downloaded::{file_name} "
                  f"({round(file_size / (1024 ** 3), 3)} GB)"
              )

              if NEED_PD:
                  send_status("Uploading file to Pixeldrain", "pixeldrain", "Pixeldrain upload is in progress.")
                  try:
                      pixeldrain_url = upload_to_pixeldrain(file_path, file_name)
                      pd_status = "success"
                      print("::notice title=Pixeldrain Success::" + pixeldrain_url)
                  except JobCancelled:
                      raise
                  except Exception as error:
                      pd_status = "failed"
                      errors.append("Pixeldrain: " + str(error))
                      print("::error title=Pixeldrain Upload Failed::" + str(error))
                      send_status("Pixeldrain upload failed", "pixeldrain", str(error)[:900])

              if NEED_MEGA:
                  send_status("Checking MEGA accounts and storage", "mega", "Checking configured MEGA accounts.")
                  try:
                      mega_url, used_mega_account = upload_to_mega(
                          file_path, file_name, file_size
                      )
                      mega_status = "success"
                      print("::notice title=MEGA Success::" + used_mega_account + " uploaded the file.")
                  except JobCancelled:
                      raise
                  except Exception as error:
                      mega_status = "failed"
                      errors.append("MEGA: " + str(error))
                      print("::error title=MEGA Upload Failed::" + str(error))
                      send_status("MEGA upload failed", "mega", str(error)[:900])

          except JobCancelled as cancelled:
              print("::notice title=Cancelled::" + str(cancelled))
              sys.exit(0)
          except Exception as error:
              errors.append("Source: " + str(error))
              print("::error title=Mirror Job Failed::" + str(error))
              if NEED_PD and pd_status == "pending":
                  pd_status = "failed"
              if NEED_MEGA and mega_status == "pending":
                  mega_status = "failed"

          # Always report final target-specific results. Unrequested destinations stay skipped.
          try:
              send_status("Sending final results to WordPress", "WordPress", "Saving platform links and completing queue record.")
              if NEED_PD and pd_status == "pending":
                  pd_status = "failed"
              if NEED_MEGA and mega_status == "pending":
                  mega_status = "failed"
              send_final_callback(
                  file_name, pixeldrain_url, mega_url, used_mega_account,
                  pd_status, mega_status,
                  "; ".join(errors) if errors else "Requested upload destination(s) processed."
              )
          except JobCancelled as cancelled:
              print("::notice title=Cancelled::" + str(cancelled))
              sys.exit(0)
          except Exception as error:
              print("::error title=WordPress Callback Failed::" + str(error))
              sys.exit(1)

          success = (not NEED_PD or pd_status == "success") and (not NEED_MEGA or mega_status == "success") and download_ok
          if not success:
              sys.exit(1)
