name: Auto Mirror Google Drive to Pixeldrain

on:
  repository_dispatch:
    types: [mirror_gdrive_file]

jobs:
  mirror_file:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip gdown requests

      - name: Download from Google Drive and Upload to Pixeldrain
        shell: python
        env:
          POST_ID: ${{ github.event.client_payload.post_id }}
          GDRIVE_ID: ${{ github.event.client_payload.gdrive_id }}
          NEED_PD: ${{ github.event.client_payload.need_pd }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          WEBHOOK_SECRET: ${{ github.event.client_payload.webhook_secret }}
          PIXELDRAIN_API: ${{ github.event.client_payload.pixeldrain_api }}
        run: |
          import os, sys, urllib.parse, requests, gdown

          POST_ID = os.environ.get("POST_ID", "").strip()
          GDRIVE_ID = os.environ.get("GDRIVE_ID", "").strip()
          NEED_PD = os.environ.get("NEED_PD", "yes").strip() or "yes"
          CALLBACK_URL = os.environ.get("CALLBACK_URL", "").strip()
          WEBHOOK_SECRET = os.environ.get("WEBHOOK_SECRET", "").strip()
          PIXELDRAIN_API = os.environ.get("PIXELDRAIN_API", "").strip()

          if not GDRIVE_ID:
              print("::error title=Google Drive Error::Google Drive file ID is missing.")
              sys.exit(1)

          if not CALLBACK_URL or not WEBHOOK_SECRET:
              print("::error title=Callback Error::WordPress callback URL or webhook secret is missing.")
              sys.exit(1)

          DOWNLOAD_DIR = os.path.abspath("downloads")
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)
          os.chdir(DOWNLOAD_DIR)

          # 1. Download the source file from Google Drive.
          try:
              url = f"https://drive.google.com/uc?id={GDRIVE_ID}"
              downloaded_path = gdown.download(url, quiet=False)

              if not downloaded_path or not os.path.isfile(downloaded_path):
                  print("::error title=Google Drive Error::File could not be downloaded from Google Drive.")
                  sys.exit(1)

              file_path = os.path.abspath(downloaded_path)
          except Exception as e:
              print(f"::error title=Google Drive Exception::{e}")
              sys.exit(1)

          file_name = os.path.basename(file_path)
          file_size = os.path.getsize(file_path)
          file_size_gb = round(file_size / (1024 ** 3), 3)
          print(f"::notice title=Downloaded::{file_name} (Size: {file_size_gb} GB)")

          # 2. Upload to Pixeldrain only.
          pixeldrain_url = ""
          if NEED_PD == "yes":
              if not PIXELDRAIN_API:
                  print("::error title=Pixeldrain Error::Pixeldrain API key is not configured in WordPress settings.")
              else:
                  try:
                      encoded_name = urllib.parse.quote(file_name)
                      pd_api_url = f"https://pixeldrain.com/api/file/{encoded_name}"

                      with open(file_path, "rb") as file_handle:
                          response = requests.put(
                              pd_api_url,
                              auth=("", PIXELDRAIN_API),
                              data=file_handle,
                              timeout=(30, 7200),
                          )

                      response_data = response.json() if response.content else {}
                      if response.status_code in (200, 201) and response_data.get("id"):
                          pixeldrain_url = f"https://pixeldrain.com/u/{response_data['id']}"
                          print(f"::notice title=Pixeldrain Success::{pixeldrain_url}")
                      else:
                          print(f"::error title=Pixeldrain Error::{response.status_code} - {response.text}")
                  except Exception as e:
                      print(f"::error title=Pixeldrain Exception::{e}")
          else:
              print("::notice title=Pixeldrain Skipped::An active Pixeldrain link already exists; upload skipped.")

          # 3. Send the Pixeldrain result back to WordPress.
          try:
              payload = {
                  "webhook_secret": WEBHOOK_SECRET,
                  "post_id": POST_ID,
                  "file_name": file_name,
                  "pixeldrain_url": pixeldrain_url,
              }
              headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              callback = requests.post(
                  CALLBACK_URL,
                  json=payload,
                  headers=headers,
                  timeout=30,
              )
              print(f"::notice title=WordPress Updated::Status {callback.status_code} - {callback.text}")
              callback.raise_for_status()
          except Exception as e:
              print(f"::error title=WordPress Callback Failed::{e}")
              sys.exit(1)
